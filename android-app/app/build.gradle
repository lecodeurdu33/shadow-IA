plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.applia.calculettevocale'
    compileSdk 34

    defaultConfig {
        applicationId "fr.applia.calculettevocale"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.0'
}
